[project]
name = "newhw-automator"
version = "0.1.0"
description = "A auto homework generator using LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docxtpl>=0.20.2",
    "pymupdf>=1.26.5",
    "numpy>=2.4.3",
    "openai>=2.29.0",
    "toml>=0.10.2",
    "requests>=2.32.0",
    "llama-index-core>=0.11.20",
    "llama-index-vector-stores-qdrant>=0.3.2",
    "qdrant-client>=1.11.3",
    "unstructured>=0.16.20",
    "pydantic>=2.11.0",
    "docxcompose>=2.1.0",
]
